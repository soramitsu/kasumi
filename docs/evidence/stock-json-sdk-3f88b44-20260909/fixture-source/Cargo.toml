[workspace]
resolver = "2"

[package]
name = "kasumi-stock-json-sdk-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[features]
default = []
numbers-and-raw = ["serde_json/arbitrary_precision", "serde_json/raw_value"]
ordered = ["numbers-and-raw", "serde_json/preserve_order"]

[dependencies]
kasumi-client = { path = "../../crates/kasumi-client" }
kasumi-types = { path = "../../crates/kasumi-types" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt", "time"] }
tonic = { version = "=0.14.6", default-features = false }

[[test]]
name = "consumer"
path = "consumer.rs"
