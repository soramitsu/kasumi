[package]
name = "redb-derive"
description = "Derive macros for redb"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT OR Apache-2.0"
homepage = "https://www.redb.org"
repository = "https://github.com/cberner/redb"
authors = ["Christopher Berner <me@cberner.com>"]

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1.0"
quote = "1.0"
syn = { version = "2.0", features = ["full"] }

[dev-dependencies]
redb = { path = "../..", features = ["uuid"] }
tempfile = "3.5.0"
uuid = { version = "1.17.0", features = ["v4"] }
# Old versions of the redb package, for the tests that derive against two versions at once.
# 3.0.0 is the oldest whose public API supports deriving for a struct with fields.
redb2_6 = { package = "redb", version = "=2.6.0" }
redb3_0 = { package = "redb", version = "=3.0.0" }
