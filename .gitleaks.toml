title = "Kasumi public repository secret detection"

# Keep every upstream detector enabled. Add exceptions only for independently
# verified public test data, scoped to the exact rule, path and matched value.
[extend]
useDefault = true

# The generic detector mistakes source-file names such as api.rs for credential
# assignments in these reviewed, historical source checksum manifests. Match
# only complete filename-to-SHA-256 JSON entries in the exact evidence files.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Reviewed source-file SHA-256 entries in preserved evidence"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"[^"\r\n]+\.(?:rs|log|json|md|stderr|patch)":\s*"[a-f0-9]{64}"[,]?\s*$''']
