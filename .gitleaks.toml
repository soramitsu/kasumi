[[rules.allowlists]]
description = "Reviewed backup verification key-lineage digest"
condition = "AND"
regexTarget = "line"
regexes = ['''^\s*"key_lineage_digest":\s*"[a-f0-9]{64}"[,]?\s*$''']
paths = [
    '''(?:^|/)docs/evidence/linux\-image\-systemd\-smoke\-20260908/kasumi\-oci\-recipe\-42bf607\-backup\-verify\.log$''',
]

# File scanning splits large files into blocks. These exact reviewed checksum
# fragments cross a block boundary, so the full JSON-line allowance cannot match.
[[rules.allowlists]]
description = "Exact reviewed SHA-256 fragment at a file scanner block boundary"
condition = "AND"
regexTarget = "match"
regexes = ['''^kasumi\-benchmark\-credentials\-tests\.log":\ "d6a897de70ffe97ff5925ffeaa7f7b9ff66e63fa8c498e4f55f9cd2e93ff1374$''']
paths = [
    '''(?:^|/)docs/evidence/literal\-json\-upstream\-20260909/13fbbc1/source\-after\.json$''',
    '''(?:^|/)docs/evidence/literal\-json\-upstream\-20260909/13fbbc1/source\-before\.json$''',
    '''(?:^|/)docs/evidence/literal\-json\-upstream\-20260909/8f4cf74/source\-after\.json$''',
    '''(?:^|/)docs/evidence/literal\-json\-upstream\-20260909/8f4cf74/source\-before\.json$''',
]

