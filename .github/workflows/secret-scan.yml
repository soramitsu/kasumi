name: Secret scan

on:
  pull_request:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 3 * * 1"

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install checksum-verified Gitleaks
        shell: bash
        run: |
          set -euo pipefail
          scan_tools="$RUNNER_TEMP/kasumi-secret-scan"
          mkdir -p "$scan_tools"
          curl --fail --silent --show-error --location --retry 3 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$scan_tools/gitleaks.tar.gz"
          printf '%s  %s\n' \
            551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb \
            "$scan_tools/gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf "$scan_tools/gitleaks.tar.gz" -C "$scan_tools" gitleaks
          "$scan_tools/gitleaks" version
          printf '%s\n' "$scan_tools" >> "$GITHUB_PATH"
      - name: Scan checked-out files
        shell: bash
        run: |
          gitleaks dir --config .gitleaks.toml --redact=100 \
            --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null .
      - name: Scan all fetched history
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          gitleaks git --config .gitleaks.toml --redact=100 \
            --ignore-gitleaks-allow --gitleaks-ignore-path /dev/null \
            --log-opts="--all --full-history -m" .
