[workspace]
resolver = "2"
members = ["crates/kasumi-types", "crates/kasumi-store", "crates/kasumi-query", "crates/kasumi-raft", "crates/kasumi-engine", "crates/kasumi-server", "crates/kasumi-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["arbitrary_precision"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
uuid = { version = "1", features = ["v4", "serde"] }
sha2 = "0.10"
hex = "0.4"
tempfile = "3"
kasumi-types = { path = "crates/kasumi-types" }
kasumi-store = { path = "crates/kasumi-store" }
kasumi-query = { path = "crates/kasumi-query" }
kasumi-raft = { path = "crates/kasumi-raft" }
kasumi-engine = { path = "crates/kasumi-engine" }

[profile.release]
lto = "thin"
codegen-units = 1
