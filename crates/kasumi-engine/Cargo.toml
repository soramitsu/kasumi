[package]
name = "kasumi-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
test-utils = ["kasumi-store/test-utils"]

[dependencies]
kasumi-clock.workspace = true
kasumi-serving.workspace = true
ring = "0.17"
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
kasumi-types.workspace = true
kasumi-query.workspace = true
kasumi-raft.workspace = true
kasumi-store.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
arc-swap = "=1.9.2"
imbl = { version = "=7.0.1", features = ["serde"] }
url = "=2.5.8"
libc = "=0.2.189"

[dev-dependencies]
redb = "4.2"
kasumi-engine = { path = ".", features = ["test-utils"] }
kasumi-serving = { workspace = true, features = ["test-utils"] }
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
async-trait.workspace = true
tempfile.workspace = true
kasumi-store = { workspace = true, features = ["test-utils"] }
