[package]
name = "kasumi-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
default-run = "kasumi-bench"

[features]
network = ["dep:kasumi-server", "dep:kasumi-transport", "dep:reqwest", "dep:tonic", "dep:zeroize"]
loopback = ["network", "kasumi-server/test-utils", "dep:rcgen", "dep:jsonwebtoken", "dep:base64", "dep:axum", "dep:async-trait"]

[[bin]]
name = "kasumi-bench-network"
path = "src/bin/network.rs"
required-features = ["network"]

[[bin]]
name = "kasumi-bench-loopback"
path = "src/bin/loopback.rs"
required-features = ["loopback"]

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
sha2.workspace = true
hex.workspace = true
tempfile.workspace = true
kasumi-types.workspace = true
kasumi-engine.workspace = true
kasumi-raft.workspace = true
kasumi-store = { workspace = true, features = ["test-utils"] }
libc = "0.2"
kasumi-server = { path = "../kasumi-server", optional = true }
kasumi-transport = { workspace = true, optional = true }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"], optional = true }
tonic = { version = "0.14", default-features = false, features = ["transport", "codegen"], optional = true }
zeroize = { version = "1", optional = true }
rcgen = { version = "0.14", optional = true }
jsonwebtoken = { version = "9.3.1", optional = true }
base64 = { version = "0.22", optional = true }
axum = { version = "0.8", optional = true }
async-trait = { workspace = true, optional = true }
