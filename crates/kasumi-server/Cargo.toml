[package]
name = "kasumi-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[features]
test-utils = ["kasumi-store/test-utils"]

[dependencies]
ring = "0.17"
kasumi-clock.workspace = true
kasumi-authority.workspace = true
kasumi-serving.workspace = true
hex.workspace = true
anyhow.workspace = true
async-trait.workspace = true
kasumi-types.workspace = true
kasumi-client.workspace = true
kasumi-transport.workspace = true
kasumi-engine.workspace = true
kasumi-store.workspace = true
kasumi-raft.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
tracing.workspace = true
jsonwebtoken = "9.3.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
axum = "0.8"
tonic = { version = "0.14", default-features = false, features = ["router", "transport", "codegen", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
rmcp = { version = "=3.2.0", features = ["server", "transport-streamable-http-server"] }
schemars = "1"
url = "2"
zeroize = { version = "1", features = ["derive"] }
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
http-body-util = "0.1"
sha2.workspace = true
hyper = { version = "1", features = ["server", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["server-auto", "http1", "http2", "tokio", "service"] }
base64 = "0.22"
rcgen = { version = "0.14", features = ["x509-parser"] }
time = "0.3"
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "json", "registry", "std"] }

[dev-dependencies]
kasumi-engine = { workspace = true, features = ["test-utils"] }
base64 = "0.22"
rcgen = { version = "0.14", features = ["x509-parser"] }
tempfile.workspace = true
kasumi-store = { workspace = true, features = ["test-utils"] }
