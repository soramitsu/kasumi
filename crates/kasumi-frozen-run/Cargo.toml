[package]
name = "kasumi-frozen-run"
description = "Authenticated sorted runs and compact mutable binary-key storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
lz4_flex = { version = "0.13.1", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
sha2.workspace = true
tempfile.workspace = true
# Already in the workspace graph through the text index; used only for blocks a
# writer was asked to compress with Zstandard.
zstd = { version = "0.13", default-features = false }

[target.'cfg(unix)'.dependencies]
libc.workspace = true
uuid.workspace = true
rustix = { version = "1", features = ["fs"] }
arrayvec = "0.7"

[dev-dependencies]
hex.workspace = true
serde_json.workspace = true
