[package]
name = "kasumi-raft"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Replicated state and durable command custody for Kasumi."

[features]
test-utils = []

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
uuid.workspace = true
kasumi-store.workspace = true
kasumi-types.workspace = true
sha2.workspace = true
hex.workspace = true
openraft = { version = "=0.9.25", features = ["serde", "storage-v2"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }

[dev-dependencies]
tempfile.workspace = true
kasumi-store = { workspace = true, features = ["test-utils"] }
kasumi-serving = { workspace = true, features = ["test-utils"] }
ring = "0.17"
