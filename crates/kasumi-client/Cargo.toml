[package]
name = "kasumi-client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Native Rust client for the Kasumi document database."

[dependencies]
tokio.workspace = true
url = "2"
uuid.workspace = true
anyhow.workspace = true
kasumi-types.workspace = true
kasumi-serving.workspace = true
kasumi-clock.workspace = true
hex.workspace = true
sha2.workspace = true
kasumi-transport.workspace = true
libc.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }
thiserror.workspace = true
zeroize = "1"
tonic = { version = "0.14", default-features = false, features = ["router", "transport", "codegen", "tls-ring"] }
tonic-prost = "0.14"
prost = "0.14"
bytes = "1"
http = "1"
http-body = "1"
tower-service = "0.3"

[build-dependencies]
# Cargo resolves host features separately under resolver v2. Keep the canonical
# Iroha bytes fork on its required std feature for prost-build and tonic-prost-build.
bytes = { version = "1", features = ["std"] }
tonic-prost-build = "0.14"
prost-build = "0.14"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile.workspace = true
ring = "0.17"
