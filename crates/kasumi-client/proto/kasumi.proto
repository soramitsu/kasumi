syntax = "proto3";
package kasumi.v1;

// Every call requires its own Authorization: Bearer token. Tenant identity comes
// from that verified token. Service and cluster listeners additionally require mTLS.
// JSON payloads are UTF-8 bytes so numeric literals never pass through protobuf's
// double-valued google.protobuf.Struct representation.
service KasumiData {
  rpc Get(GetRequest) returns (Document);
  rpc Query(QueryRequest) returns (QueryResponse);
  rpc ReadSnapshot(ReadSnapshotRequest) returns (ReadSnapshotResponse);
  rpc ReadChangeFeed(ReadChangeFeedRequest) returns (ReadChangeFeedResponse);
  rpc BeginStagedTransaction(BeginStagedTransactionRequest) returns (WriteReceipt);
  rpc AppendStagedChunk(AppendStagedChunkRequest) returns (WriteReceipt);
  rpc FinalizeStagedTransaction(StagedTransactionReference) returns (WriteReceipt);
  rpc StopStagedTransaction(StopStagedTransactionRequest) returns (StagedTransactionStatusResponse);
  rpc StagedTransactionStatus(StagedTransactionReference) returns (StagedTransactionStatusResponse);
  rpc OpenSnapshotLease(OpenSnapshotLeaseRequest) returns (SnapshotLeaseResponse);
  rpc ReadSnapshotPage(ReadSnapshotPageRequest) returns (ReadSnapshotResponse);
  rpc ScanSnapshotPage(ScanSnapshotPageRequest) returns (SnapshotScanPageResponse);
  rpc CloseSnapshotLease(SnapshotLeaseReference) returns (CloseSnapshotLeaseResponse);
  rpc Mutate(MutateRequest) returns (WriteReceipt);
  rpc Collections(CollectionsRequest) returns (CollectionsResponse);
  rpc Receipt(ReceiptRequest) returns (ReceiptResponse);
}

// Bind only to the administrative listener. These methods still enforce the
// current tenant/collection admin policy in consensus order.
service KasumiAdmin {
  rpc ReadCustody(RetirementReference) returns (CustodyStatusResponse);
  rpc ExecuteCustody(CustodyCommandRequest) returns (CustodyReceiptResponse);
  rpc AbortRetirement(RetireSourceRequest) returns (RetirementStatusResponse);
  rpc RetireSource(RetireSourceRequest) returns (RetirementReceiptResponse);
  rpc RetirementStatus(RetirementReference) returns (RetirementStatusResponse);
  rpc VerifyRetirementReceipt(RetirementReference) returns (RetirementReceiptResponse);
  rpc CreateBackupCheckpoint(CreateBackupCheckpointRequest) returns (BackupCheckpointResponse);
  rpc VerifyBackupCheckpoint(VerifyBackupCheckpointRequest) returns (BackupCheckpointResponse);
  rpc ReadSchema(ReadSchemaRequest) returns (ReadSchemaResponse);
  rpc ActivateSchema(SchemaChangeSetRequest) returns (WriteReceipt);
  rpc SchemaActivationStatus(SchemaActivationReference) returns (SchemaActivationStatusResponse);
  rpc ArchiveHistory(ArchiveHistoryRequest) returns (WriteReceipt);
  rpc CreateCollection(CollectionDefinitionRequest) returns (WriteReceipt);
  rpc ReplaceCollection(CollectionDefinitionRequest) returns (WriteReceipt);
  rpc SetPolicy(SetPolicyRequest) returns (WriteReceipt);
  rpc SetLimits(SetLimitsRequest) returns (WriteReceipt);
  rpc SetSuspended(SetSuspendedRequest) returns (WriteReceipt);
  // Closed, versioned administrative command enum; destinations are configured
  // server-side names. No request carries a tenant override or filesystem path.
  rpc Manage(ManagementRequest) returns (ManagementResponse);
}

message GetRequest { string collection = 1; string id = 2; }
message Document { string id = 1; uint64 version = 2; bytes body_json = 3; }
message QueryRequest { bytes query_json = 1; }
message ReadSnapshotRequest { bytes request_json = 1; }
message ReadSnapshotResponse { bytes response_json = 1; }
message ReadChangeFeedRequest { bytes request_json = 1; }
message ReadChangeFeedResponse { bytes response_json = 1; }
message ArchiveHistoryRequest { bytes request_json = 1; }
message SchemaChangeSetRequest { bytes request_json = 1; }
message ReadSchemaRequest { bytes request_json = 1; }
message ReadSchemaResponse { bytes response_json = 1; }
message SchemaActivationReference { bytes request_json = 1; }
message SchemaActivationStatusResponse { bytes response_json = 1; }
message BeginStagedTransactionRequest { bytes request_json = 1; }
message AppendStagedChunkRequest { bytes request_json = 1; }
message StopStagedTransactionRequest { bytes request_json = 1; }
message StagedTransactionReference { bytes request_json = 1; }
message StagedTransactionStatusResponse { bytes response_json = 1; }
message OpenSnapshotLeaseRequest { bytes request_json = 1; }
message SnapshotLeaseResponse { bytes response_json = 1; }
message ReadSnapshotPageRequest { bytes request_json = 1; }
message ScanSnapshotPageRequest { bytes request_json = 1; }
message SnapshotScanPageResponse { bytes response_json = 1; }
message SnapshotLeaseReference { string lease_id = 1; }
message CloseSnapshotLeaseResponse {}
message QueryRow { Document document = 1; optional float score = 2; }
message QueryResponse {
  uint64 revision = 1;
  repeated QueryRow rows = 2;
  repeated bytes aggregates_json = 3;
  optional string cursor = 4;
}
message MutateRequest { bytes batch_json = 1; }
message WriteReceipt { uint64 revision = 1; map<string, uint64> versions = 2; }
message CollectionsRequest {}
message CollectionsResponse { repeated bytes definitions_json = 1; }
message ReceiptRequest { string idempotency_key = 1; }
message DatabaseError { string code = 1; string message = 2; }
message ReceiptResponse {
  // Neither outcome set means there is no retained receipt for this principal/key.
  oneof outcome { WriteReceipt committed = 1; DatabaseError rejected = 2; }
}
message CollectionDefinitionRequest { bytes definition_json = 1; }
message SetPolicyRequest { bytes policy_json = 1; }
message SetLimitsRequest { bytes limits_json = 1; }
message SetSuspendedRequest { bool suspended = 1; }
message ManagementRequest { bytes command_json = 1; }
message ManagementResponse { bytes result_json = 1; }

message CreateBackupCheckpointRequest { bytes request_json = 1; }
message VerifyBackupCheckpointRequest { bytes request_json = 1; }
message BackupCheckpointResponse { bytes response_json = 1; }

message RetireSourceRequest { bytes request_json = 1; }
message RetirementReference { bytes request_json = 1; }
message RetirementReceiptResponse { bytes response_json = 1; }
message RetirementStatusResponse { bytes response_json = 1; }

message CustodyCommandRequest { bytes request_json = 1; }
message CustodyReceiptResponse { bytes response_json = 1; }
message CustodyStatusResponse { bytes response_json = 1; }
