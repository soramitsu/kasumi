# Dedicated acceptance VM. No host home mounts, agent forwarding, automatic
# port exposure, floating image fallback, or unrelated workloads.
minimumLimaVersion: "2.2.0"
vmType: vz
os: Linux
arch: aarch64
# Rosetta requires Lima's guest agent; no host directories are shared.
# The host must already have Apple's Rosetta installed for translated x86 checks.
plain: false
vmOpts:
  vz:
    rosetta:
      enabled: true
      binfmt: true
images:
  - location: "https://cloud.debian.org/images/cloud/trixie/20260712-2537/debian-13-genericcloud-arm64-20260712-2537.qcow2"
    arch: aarch64
    digest: "sha512:8543d795f2fde630eb66c492f245a8c1da19dedc636e0a8e7b3d0f95920e1a05aa911ef2d82d177d41cc53ced5fccbd2a3945d07fa5e15018914c4d864bb07ed"
cpus: 2
memory: "8GiB"
disk: "120GiB"
mounts: []
ssh:
  loadDotSSHPubKeys: false
  forwardAgent: false
containerd:
  system: false
  user: false
portForwards:
  - guestIP: "0.0.0.0"
    guestIPMustBeZero: false
    proto: any
    ignore: true
upgradePackages: false
provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      export DEBIAN_FRONTEND=noninteractive
      apt-get update
      apt-get install -y --no-install-recommends ca-certificates curl git build-essential clang cmake pkg-config protobuf-compiler python3 python3-venv ripgrep docker.io docker-cli
      systemctl enable --now docker
      install -d -m 0755 /opt/kasumi-acceptance
      dpkg-query -W > /opt/kasumi-acceptance/debian-packages.txt
